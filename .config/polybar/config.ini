; vxwm rice — top bar. Colors come straight from pywal (regenerated by setwal/wal).
[colors]
include-file = ~/.cache/wal/colors-polybar

[bar/main]
; floating pill: inset from every edge + rounded corners
width = 98%
height = 30
offset-x = 1%
offset-y = 6
radius = 12
fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = Adwaita Sans:size=11;2
font-1 = JetBrainsMono Nerd Font Mono:size=12;2

modules-left = brightness sep-L tags
modules-center = date
modules-right = cava sep-C network sep-1 bluetooth sep-2 xkeyboard sep-3 tray sep-4 volume

cursor-click = pointer
enable-ipc = true

; far-left gauge: scroll to change screen brightness
[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
interval = 1
scroll-up = bright up
scroll-down = bright down

[module/sep-L]
type = custom/text
format = │
format-foreground = ${colors.disabled}
format-padding = 1

[module/tags]
type = custom/script
exec = ~/.config/polybar/scripts/tags.sh
tail = true

[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/date.sh
tail = true
click-left = calendar-popup &

; small spectrum, sits right after the centered date/time
[module/cava]
type = custom/script
exec = ~/.config/polybar/scripts/cava.sh
tail = true

[module/sep-C]
type = custom/text
format = │
format-foreground = ${colors.disabled}
format-padding = 1

; thin dim divider between the right-side clusters
[module/sep-1]
type = custom/text
format = │
format-foreground = ${colors.disabled}
format-padding = 1

[module/sep-2]
type = custom/text
format = │
format-foreground = ${colors.disabled}
format-padding = 1

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
tail = true
; no persistent nm-applet anymore — click opens the connection picker
click-left = nm-connection-editor &

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 2
; no persistent blueman-applet anymore — click opens the manager
click-left = blueman-manager &

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
label-layout = %{T2}%{T-} %layout%
label-layout-foreground = ${colors.primary}

[module/sep-3]
type = custom/text
format = │
format-foreground = ${colors.disabled}
format-padding = 1

; for apps that minimize to tray (Telegram/Discord/etc) — not for wifi/bluetooth,
; those are the modules above now
[module/tray]
type = internal/tray
tray-spacing = 6
tray-size = 18

[module/sep-4]
type = custom/text
format = │
format-foreground = ${colors.disabled}
format-padding = 1

; far-right gauge: scroll to change volume, click to mute
[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 1
scroll-up = vol up
scroll-down = vol down
click-left = vol mute
