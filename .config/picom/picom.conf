# picom — tuned for infinite-canvas pans (many XMoveWindow per drag)
# backend xrender: safe on weak/GL-broken drivers; glx only if real HW GL works

shadow = true;
shadow-radius = 18;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-opacity = 0.75;

# fading on every map is fine; during canvas drag it adds compositor work
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 1.0;

corner-radius = 6;

backend = "xrender";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
# damage=true = only redraw changed regions (much smoother when panning the canvas)
use-damage = true;

# All per-window behavior lives in one "rules" array — picom silently drops
# old-style shadow-exclude/rounded-corners-exclude the moment "rules" is also
# set, so everything got migrated here instead of split across both styles.
rules = (
  {
    match = "window_type = 'dock' || window_type = 'tooltip' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'combo' || window_type = 'utility' || name = 'Dunst' || name = 'dmenu-above' || class_g = 'stalonetray' || class_g = 'vxwm' || class_g = 'dmenu' || class_g = 'dmenu-above'";
    shadow = false;
  },
  {
    match = "window_type = 'dock' || window_type = 'tooltip' || window_type = 'menu' || window_type = 'desktop' || window_type = 'popup_menu' || name = 'Dunst' || name = 'dmenu-above' || class_g = 'stalonetray' || class_g = 'dmenu' || class_g = 'dmenu-above'";
    corner-radius = 0;
  },
  {
    # rofi slides up from the bottom on open, back down on close — scoped to
    # just this window so it doesn't touch canvas-pan performance elsewhere.
    match = "class_g = 'Rofi'";
    animations = (
      {
        triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2, 1, 0.2, 1)"; duration = 0.18; start = 0; end = 1; };
        offset-y = { curve = "cubic-bezier(0.2, 1, 0.2, 1)"; duration = 0.18; start = 40; end = 0; };
      },
      {
        triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 1; end = 0; };
        offset-y = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 0; end = 40; };
      }
    );
  },
  {
    # calendar-popup slides down from the bar on open, back up on close.
    match = "name = 'Calendar'";
    animations = (
      {
        triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2, 1, 0.2, 1)"; duration = 0.18; start = 0; end = 1; };
        offset-y = { curve = "cubic-bezier(0.2, 1, 0.2, 1)"; duration = 0.18; start = -24; end = 0; };
      },
      {
        triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 1; end = 0; };
        offset-y = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 0; end = -24; };
      }
    );
  },
  {
    # centered dialogs opened from the bar (wifi/bluetooth) — plain fade,
    # no directional slide since they're not anchored to a bar edge.
    match = "class_g = 'Nm-connection-editor' || class_g = 'Blueman-manager'";
    animations = (
      {
        triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2, 1, 0.2, 1)"; duration = 0.15; start = 0; end = 1; };
      },
      {
        triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 1; end = 0; };
      }
    );
  },
  {
    # powermenu — centered on screen, same plain fade as the other dialogs.
    match = "name = 'Powermenu'";
    animations = (
      {
        triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2, 1, 0.2, 1)"; duration = 0.15; start = 0; end = 1; };
      },
      {
        triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 1; end = 0; };
      }
    );
  },
  {
    # wpick — same treatment as the other centered GTK popups.
    match = "name = 'wpick'";
    animations = (
      {
        triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2, 1, 0.2, 1)"; duration = 0.15; start = 0; end = 1; };
      },
      {
        triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 1; end = 0; };
      }
    );
  },
  {
    # Code - OSS — primary Super+Return app now. Bigger, more visible corner
    # radius than the rice default (6), plus a plain fade like the other
    # floating popups.
    match = "class_g = 'code-oss'";
    corner-radius = 12;
    animations = (
      {
        triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2, 1, 0.2, 1)"; duration = 0.15; start = 0; end = 1; };
      },
      {
        triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 1; end = 0; };
      }
    );
  }
)
